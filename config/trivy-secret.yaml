rules:
  - id: "generic-token"
    description: "Aggressive Generic Token Match"
    severity: "HIGH"
    category: "Secret"
    regex: "(?i)((key|api|token|secret|password|auth|access)[a-z0-9_\\.\\-\\/]*['\"]?[:= ]+['\"]?[0-9a-zA-Z\\-_=]{8,64}['\"]?)"
    tags:
      - "aggressive"
  - id: "generic-password"
    description: "Aggressive Password Match"
    severity: "CRITICAL"
    category: "Secret"
    regex: '(?i)password[''"]?[:= ]+[''"]?.*[''"]?'
    tags:
      - "aggressive"
  - id: "generic-secret-low"
    description: "Low Confidence Aggressive Match"
    severity: "LOW"
    category: "Secret"
    regex: "(?i)(secret|confidential|private|db|database)[-_]?(val|value|str|string)?['\"]?[:= ]+['\"]?[a-zA-Z0-9\\-_]{4,64}['\"]?"
    tags:
      - "aggressive"
